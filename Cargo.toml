[package]
name = "avizo"
version = "1.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A simple notification daemon, mainly intended for multimedia keys"
publish = false
build = "build.rs"

[[bin]]
name = "avizo-service"
path = "src/bin/avizo-service.rs"

[[bin]]
name = "avizo-client"
path = "src/bin/avizo-client.rs"

# Exact versions, matching Cargo.lock: the gtk-rs 0.18 (GTK 3) bindings.
[dependencies]
gtk = "=0.18.2"
gdk = "=0.18.2"
glib = "=0.18.5"
gio = "=0.18.4"
gdk-pixbuf = "=0.18.5"
cairo-rs = "=0.18.5"
gtk-layer-shell = { version = "=0.8.2", features = ["v0_6"] }

[build-dependencies]
glib-build-tools = "=0.18.0"
